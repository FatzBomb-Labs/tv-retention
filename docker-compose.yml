services:
  tv-retention:
    image: ghcr.io/fatzbomb-labs/tv-retention:beta
    container_name: tv-retention
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      # The only required volume. No media mount: this never opens a library file — Sonarr
      # owns the filesystem, and deletion is an API call.
      - ./config:/config
      # Optional persistent backup destination. Set System -> Backup to /backups after
      # enabling this mount. The host directory must already be writable by PUID:PGID;
      # the container deliberately does not recursively chown an operator-supplied mount.
      # - ./backups:/backups
    environment:
      - TVR_USERNAME=admin
      # Shorter than the eight characters TVR_PASSWORD requires, on purpose: the
      # container refuses to start until this is replaced with a real password, rather
      # than quietly running with a value anyone reading this file already knows.
      - TVR_PASSWORD=EDIT-ME
      # Or, if nothing untrusted can reach the port — behind Tailscale or a VPN — and you
      # would rather have no login at all:
      # - TVR_AUTH=none
      # Who owns /config. The container takes it on start, so no chown is asked of you.
      # 1000:1000 by default; on Unraid use 99:100.
      # - PUID=1000
      # - PGID=1000
      # - UMASK=022
